<text x='324.00' y='234.26' text-anchor='middle' style='font-size: 8.25px; font-family: "Arial";'>depth = 0 replicate  →  treated as MISSING (not "modification lost")</text>
<text x='324.00' y='243.66' text-anchor='middle' style='font-size: 8.25px; font-family: "Arial";'>excluded from Mut_Ratio mean and from the test:  3v3 → 3v2</text>
<text x='324.00' y='253.07' text-anchor='middle' style='font-size: 8.25px; font-family: "Arial";'>if a whole group is wiped out  →  p = NA</text>
