<rect x='77.76' y='302.82' width='492.48' height='50.47' style='stroke-width: 1.49; stroke-linecap: butt; stroke-linejoin: miter; fill: #FFFFFF;' />
<text x='324.00' y='326.12' text-anchor='middle' style='font-size: 9.10px; font-family: "Arial";'>logit(π) = β0 + β1 · x        x = 1 (WT) / 0 (mutant),   weight = depth</text>
<text x='324.00' y='336.50' text-anchor='middle' style='font-size: 9.10px; font-family: "Arial";'>β1 &gt; 0  means  WT &gt; mutant   →   the dependent direction</text>
