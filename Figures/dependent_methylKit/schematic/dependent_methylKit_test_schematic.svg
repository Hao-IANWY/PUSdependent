<text x='174.96' y='467.20' text-anchor='middle' style='font-size: 8.25px; font-family: "Arial";'>φ &gt; 1   →   F test</text>
<text x='174.96' y='476.60' text-anchor='middle' style='font-size: 8.25px; font-family: "Arial";'>deviance/φ ~ F(1, n−2)</text>
<text x='174.96' y='486.01' text-anchor='middle' style='font-size: 8.25px; font-family: "Arial";'>penalizes noisy replicates</text>
<rect x='336.96' y='446.47' width='272.16' height='54.35' style='stroke-width: 1.49; stroke-linecap: butt; stroke-linejoin: miter; fill: #FFFFFF;' />
<text x='473.04' y='467.20' text-anchor='middle' style='font-size: 8.25px; font-family: "Arial";'>φ ≤ 1   →   χ² test</text>
<text x='473.04' y='476.60' text-anchor='middle' style='font-size: 8.25px; font-family: "Arial";'>ordinary likelihood ratio</text>
<text x='473.04' y='486.01' text-anchor='middle' style='font-size: 8.25px; font-family: "Arial";'>replicates consistent</text>
<line x1='174.96' y1='500.82' x2='298.08' y2='520.24' style='stroke-width: 1.49; stroke: #404040; stroke-linecap: butt;' />
