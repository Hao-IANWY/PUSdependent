# BID-seq Temperature tRNA Arabidopsis — totalRNA 流程（只分析 R2）
# 假尿苷 tRNA 文库，R2 结构：8bp UMI + TATAGGG + 插入序列 + polyA 尾巴 + 接头。
# 2026-11-06 第三次重建（6 重复口径）：72 文库（3 基因型 × 2 温度 × 2 处理 × 6 重复）。
# 数据源严格按 data_source/source.tsv 的 Temperature_tRNA 144 行（72 文库 × R1/R2）
# 建链，raw_data/links.sh 由该表驱动生成。batch1（260129-T7-248G，原 rep1-2）因
# R2 仅约 10% 读段带 TATAGGG 接头、每库只剩 ~0.1M ncRNA unique reads（batch2/3
# 为 1-3M）已剔除；原 rep3-8 顺延重编号为 rep1-6：
#   rep1-2 = batch2（merge_260702_260716）
#   rep3   = batch2（260909-T7PE150-127G）
#   rep4-6 = batch3（20261102-tRNA-temperature，4 个测序批次合并样本）
# 基因型统一为 WT / trua1b_1 / trua1b_2（trua1b_2 = 旧标签 trua1b_2/trua1b_3
# 同株系，老板 2026-11-04 拍板 _2==_3）。8 重复（含 batch1）那版结果与配置留档于
# Temperature_tRNA/archive/20261106_8rep_with_batch1/；6 重复前的 3 重复版本在
# Temperature_tRNA/archive/20261105_3rep_before_8rep_rebuild/。
# 参数沿用 tRNA/config.yaml 的 totalRNA 现行默认值；只跑 ncRNA（mRNA 两处已注释）。
# min_pass_reps 保持 3：即"6 个重复里至少 3 个通过"，与此前 3 中 3、5 中 3
# 的"至少 3 个生物学重复"口径一致（老板 2026-11-05 拍板）。

paths:
  script_dir: /home/HL/project/shuangli/PUS/PUSdependent/BID-transcript.script/bin
  pseudo_callsites_r: /home/HL/project/shuangli/PUS/PUSdependent/BID-transcript.script/bin/Pseudo_callsites.R
  index_bowtie2: /home/HL/reference/Ath/TAIR/tRNA-unique_sn_snoRNA.fa
  index_star: /home/HL/reference/Ath/TAIR/Araport11_cdna_20220914_representative_gene_model

env:
  python: /home/HL/miniforge3/envs/analysis/bin/python
  r: /home/HL/miniforge3/envs/analysis/bin/R

pipeline:
  ref:
    ncRNA: /home/HL/reference/Ath/TAIR/tRNA-unique_sn_snoRNA.fa
    # mRNA 暂时停用（2026-09-24）：只跑 ncRNA。恢复时取消此处与 count_mode 的注释。
    # mRNA: /home/HL/reference/Ath/TAIR/Araport11_cdna_20220914_representative_gene_model
  t_site_windows: 2

  # Optional raw expression matrices. Keys must match pipeline.ref.
  # Emits both a Mock-group matrix and an all_samples matrix per ref type.
  expression:
    enabled: true
    count_mode:
      ncRNA: all_alignments
      # mRNA: primary

  # 沿用当前 totalRNA 流程默认阈值（移植自 polyA 流程的硬编码/R 脚本默认值）。
  # call sites 要求至少 3 个生物学重复通过：6 重复设计下即 6 中 3。
  filter:
    min_depth: 10           # filter_t_sites: 单重复 depth >= 此值
    min_avg_depth: 10       # Mock/Treat 组平均 depth >= 此值
    max_padj: 0.01          # BH 校正 p 值 < 此值
    min_gap: 5              # 每个通过重复的 Treat gap >= 此值
    min_treat_ratio: 0.05   # 每个通过重复的 Treat ratio >= 此值
    ratio_fold: 2           # Treat ratio >= ratio_fold * Mock ratio
    min_pass_reps: 3        # 至少这么多重复通过（6 中 3）

  # totalRNA 只分析 R2：trim 单端模式处理 R2（--adapter AAAAAAAAAAA），
  # 去重用 seqkit rmdup -s。read1 仅作配对信息保留，不进入分析。
  read_layout: paired
  rmdup: true
  trim_galore_length: 35

  # totalRNA 历史默认值：R2 结构为 8bp UMI + TATAGGG + 2bp = 前 17bp。
  # R1 从片段另一端测序，该固定结构位于 R1 的 3' 端，故为 trim_tail: 17。
  # 注意：本流程仅分析 R2（trim/rmdup/umi_extract/比对均只读 R2），
  # R1 参数仅作文档性记录，不影响任何流程产物。
  umi_extract:
    R1:
      trim_front: 0
      trim_tail: 17
    R2:
      trim_front: 17
      trim_tail: 0

