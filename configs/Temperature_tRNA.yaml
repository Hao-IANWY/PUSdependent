# BID-seq Temperature tRNA Arabidopsis — totalRNA workflow (R2-only analysis)
# Pseudouridine tRNA-enriched libraries; R2 structure: 8 bp UMI + TATAGGG +
# insert + poly(A) tail + adapter.
# 36 libraries: 3 genotypes (WT, trua1b_1, trua1b_2) × 2 temperatures
# (21/27 °C) × Mock/Treat × 3 biological replicates. Library links follow the
# Temperature_tRNA rows of data_source/source.tsv (raw_data/links.sh is
# generated from that table).
# Parameters follow the totalRNA workflow defaults; only the ncRNA reference is
# processed (the mRNA entries are commented out).
# min_pass_reps = 3: all three biological replicates must pass.

paths:
  script_dir: /home/HL/project/shuangli/PUS/PUSdependent/BID-transcript.script/bin
  pseudo_callsites_r: /home/HL/project/shuangli/PUS/PUSdependent/BID-transcript.script/bin/Pseudo_callsites.R
  index_bowtie2: /home/HL/reference/Ath/TAIR/tRNA-unique_sn_snoRNA.fa
  index_star: /home/HL/reference/Ath/TAIR/Araport11_cdna_20220914_representative_gene_model

env:
  python: /home/HL/miniforge3/envs/analysis/bin/python
  r: /home/HL/miniforge3/envs/analysis/bin/R

pipeline:
  ref:
    ncRNA: /home/HL/reference/Ath/TAIR/tRNA-unique_sn_snoRNA.fa
    # mRNA reference currently disabled; ncRNA only. To re-enable, uncomment
    # here and in count_mode.
    # mRNA: /home/HL/reference/Ath/TAIR/Araport11_cdna_20220914_representative_gene_model
  t_site_windows: 2

  # Optional raw expression matrices. Keys must match pipeline.ref.
  # Emits both a Mock-group matrix and an all_samples matrix per ref type.
  expression:
    enabled: true
    count_mode:
      ncRNA: all_alignments
      # mRNA: primary

  # Site-filtering thresholds follow the totalRNA workflow defaults (inherited
  # from the poly(A) workflow's hard-coded/R-script defaults). Site calling
  # requires all three biological replicates to pass.
  filter:
    min_depth: 10           # filter_t_sites: per-replicate depth >= this
    min_avg_depth: 10       # group-level Mock/Treat mean depth >= this
    max_padj: 0.01          # BH-adjusted p-value < this
    min_gap: 5              # Treat gap >= this per passing replicate
    min_treat_ratio: 0.05   # Treat ratio >= this per passing replicate
    ratio_fold: 2           # Treat ratio >= ratio_fold * Mock ratio
    min_pass_reps: 3        # all three replicates must pass (3 of 3)

  # The totalRNA workflow analyzes R2 only: trimming runs in single-end mode on
  # R2 (--adapter AAAAAAAAAAA) and duplicates are removed with seqkit rmdup -s.
  # R1 is kept as pairing information only and does not enter the analysis.
  read_layout: paired
  rmdup: true
  trim_galore_length: 35

  # R2 read structure: 8 bp UMI + TATAGGG + 2 bp, i.e. a fixed 17 bp prefix.
  # R1 is sequenced from the other fragment end, so the fixed structure sits at
  # the R1 3' end (trim_tail: 17). Only R2 is analyzed (trim/rmdup/umi_extract/
  # alignment read R2 exclusively); the R1 entry is documentary only and does
  # not affect any workflow output.
  umi_extract:
    R1:
      trim_front: 0
      trim_tail: 17
    R2:
      trim_front: 17
      trim_tail: 0

samples:
  WT_21:
    sample_id: "WT_21"
    mock:
      rep1:
        file_index: Mock-21-WT.rep1
        read1: raw_data/Mock-21-WT.rep1.R1.fq.gz
        read2: raw_data/Mock-21-WT.rep1.R2.fq.gz
      rep2:
