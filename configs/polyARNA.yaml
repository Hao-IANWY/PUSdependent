# BID-seq polyA Arabidopsis — paired-end, dedup, historical UMI clipping
# Mapping route: Bowtie2/rRNA filtering, then STAR/Araport11 cDNA alignment.
#
# WT rep4 (from two additional flowcells) is restricted to stages: [count]:
# it contributes to the expression/count matrices and PCA, but is excluded
# from Fisher site calling because of strong between-batch effects (mutants
# have three replicates each and are unaffected). Site calling remains 3-of-3.
#
# ⚠ Do not remove stages: [count] from rep4 entries. Stale rep4 products from
#   earlier runs remain under STAT/mpileup and STAT/adjustGap (including the
#   chunk files in STAT/mpileup/*_chunk/adjusted/). Re-admitting rep4 into the
#   Fisher branch would make aggregate_adjusted_chunks pick up those stale
#   chunks instead of recomputing, yielding seemingly valid but outdated
#   results.
#
# ── Replicate-level stage tags ("stages", optional) ─────────────────────────
# Each replicate may carry a stages key declaring which branches it enters:
#     stages: [count, fisher]   # default when omitted: enters both branches
#     stages: [count]           # expression/count only, no Fisher site calling
#
# Branch boundaries:
#   count  — trim/alignment/BAM/mpileup/logs + count/{ref}/all_samples(.Mock)
#             matrices (PCA reads all_samples and picks up new replicates)
#   fisher — split_mpileup_chunks → adjustGap → filter_t_sites → fisher_sites
#
# Rationale: adjustGap estimates gaps jointly across samples, so adding one
# replicate to the fisher branch changes the gap values of every other
# replicate and forces a full site-calling rerun. Tagging expression-only
# replicates stages: [count] keeps the fisher input list byte-identical; new
# replicates only add alignment/counting jobs, leaving STAT/fisher/* and
# STAT/adjustGap/* untouched.
#
# Note: min_pass_reps applies to fisher-stage replicates only; reducing a
# sample's fisher replicates below min_pass_reps fails at DAG construction.
# Narrowing a sample's fisher subset requires archiving and manually cleaning
# the obsolete {file_index}.*.tsv files under STAT/adjustGap/ and
# STAT/mpileup/, otherwise the glob counts of STAT/dependent*/run.sh break.

paths:
  script_dir: /home/HL/project/shuangli/PUS/PUSdependent/BID-transcript.script/bin
  pseudo_callsites_r: /home/HL/project/shuangli/PUS/PUSdependent/BID-transcript.script/bin/Pseudo_callsites.R
  index_bowtie2: /home/HL/reference/Ath/TAIR/ath_rRNA.fa
  index_star: /home/HL/reference/Ath/TAIR/cDNA_STAR_index

env:
  python: /home/HL/miniforge3/envs/analysis/bin/python
  r: /home/HL/miniforge3/envs/analysis/bin/R

pipeline:
  ref:
    rRNA: /home/HL/reference/Ath/TAIR/ath_rRNA.fa
    mRNA: /home/HL/reference/Ath/TAIR/Araport11_cdna_20220914_representative_gene_model
  t_site_windows: 2

  # Optional raw expression matrices. Keys must match pipeline.ref.
  # Emits both a Mock-group matrix and an all_samples matrix per ref type.
  # all_alignments is alignment-level counting; primary is read-level counting.
  expression:
    enabled: true
    count_mode:
      rRNA: all_alignments
      mRNA: primary

  # Parallel adjustGap chunks. Boundaries always fall between reference
  # sequences/transcripts; small transcripts are batched to avoid excessive jobs.
  adjust_gap:
    chunk_bp: 250000
    max_sequences: 1000

  # Site-filtering thresholds. `min_depth` sets the candidate-pool size
  # (filter_t_sites); the rest are Fisher / per-replicate Pass criteria
  # (Pseudo_callsites.R). Defaults match the historical values.
  filter:
    min_depth: 10           # filter_t_sites: per-replicate depth >= this
    min_avg_depth: 10       # group-level Mock/Treat avg depth >= this
    max_padj: 0.01          # BH-adjusted p-value < this
    min_gap: 5              # Treat gap >= this per passing replicate
    min_treat_ratio: 0.05   # Treat ratio >= this per passing replicate
    ratio_fold: 2           # Treat ratio >= ratio_fold * Mock ratio
    min_pass_reps: 3        # at least this many replicates pass

  # Input layout is global for one workflow run. Accepted values: paired/PE or single/SE.
  # Paired mode requires read1 and read2 for every replicate.
  read_layout: paired

  # true: run the workflow-specific fastp deduplication step; false: pass trimmed
  # reads directly to umi_extract without creating *.dup.fq.gz files.
  rmdup: true

  # Minimum read length passed to trim_galore --length. This preserves the
  # historical paired-end polyA workflow default.
  trim_galore_length: 47

  # fastp UMI-region clipping. These values preserve the historical polyA
  # workflow defaults. Set both values to 0 for an end that should not be clipped.
  umi_extract:
    R1:
      trim_front: 6
      trim_tail: 21
    R2:
      trim_front: 21
      trim_tail: 6

