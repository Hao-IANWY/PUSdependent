# BID-seq tissue tRNA Arabidopsis — totalRNA workflow (R2-only analysis)
# Pseudouridine tRNA-enriched libraries; R2 structure: 8 bp UMI + TATAGGG +
# insert + poly(A) tail + adapter.
# Main (non-temperature) experiment covering Root/Leaf/Flower; WT and every
# mutant genotype have Mock/Treat × 3 replicates for site calling.
# WT rep4 (added from a later sequencing batch) and the Root rep4/rep5 entries
# of seven mutants (restored libraries from earlier preparations) are included
# with stages: [count]: they contribute to the expression/count matrices and
# PCA only and never enter Fisher site calling, which stays 3-of-3.
# ⚠ Do not remove stages: [count] from these entries: re-admitting them into
#   the Fisher branch would force a full site-calling rerun and clash with
#   stale products under STAT/adjustGap and STAT/mpileup.
# ⚠ Treat-side libraries LSRTT9–LSRTT16 are full-length tRNA paired-end
#   libraries without the UMI/TATAGGG/poly(A) structure; their counts are not
#   comparable with the BID-seq libraries — verify before use.
# Parameters follow the totalRNA workflow defaults.

paths:
  script_dir: /home/HL/project/shuangli/PUS/PUSdependent/BID-transcript.script/bin
  pseudo_callsites_r: /home/HL/project/shuangli/PUS/PUSdependent/BID-transcript.script/bin/Pseudo_callsites.R
  index_bowtie2: /home/HL/reference/Ath/TAIR/tRNA-unique_sn_snoRNA.fa
  index_star: /home/HL/reference/Ath/TAIR/cDNA_STAR_index

env:
  python: /home/HL/miniforge3/envs/analysis/bin/python
  r: /home/HL/miniforge3/envs/analysis/bin/R

pipeline:
  ref:
    ncRNA: /home/HL/reference/Ath/TAIR/tRNA-unique_sn_snoRNA.fa
    # mRNA reference currently disabled; ncRNA only. To re-enable, uncomment
    # here and in count_mode.
    # mRNA: /home/HL/reference/Ath/TAIR/Araport11_cdna_20220914_representative_gene_model
  t_site_windows: 2

  # Optional raw expression matrices. Keys must match pipeline.ref.
  # Emits both a Mock-group matrix and an all_samples matrix per ref type.
  expression:
    enabled: true
    count_mode:
      ncRNA: all_alignments
      # mRNA: primary

  # Site-filtering thresholds follow the totalRNA workflow defaults. Site
  # calling requires all three biological replicates to pass (3 of 3) for
  # every sample; replicates marked stages: [count] do not enter site calling.
  filter:
    min_depth: 10
    min_avg_depth: 10
    max_padj: 0.01
    min_gap: 5
    min_treat_ratio: 0.05
    ratio_fold: 2
    min_pass_reps: 3

  # The totalRNA workflow analyzes R2 only: trimming runs in single-end mode on
  # R2 (--adapter AAAAAAAAAAA) and duplicates are removed with seqkit rmdup -s.
  # R1 is kept as pairing information only and does not enter the analysis.
  read_layout: paired
  rmdup: true
  trim_galore_length: 35

  # R2 read structure: 8 bp UMI + TATAGGG + 2 bp, i.e. a fixed 17 bp prefix.
  # R1 is sequenced from the other fragment end, so the fixed structure sits at
  # the R1 3' end (trim_tail: 17). Only R2 is analyzed (trim/rmdup/umi_extract/
  # alignment read R2 exclusively); the R1 entry is documentary only and does
  # not affect any workflow output.
  umi_extract:
    R1:
      trim_front: 0
      trim_tail: 17
    R2:
      trim_front: 17
      trim_tail: 0

samples:
  WT_Root:
    sample_id: "WT_Root"
    mock:
      rep1:
        file_index: Mock-WT-Root.rep1
        read1: raw_data/Mock-WT-Root.rep1.R1.fq.gz
        read2: raw_data/Mock-WT-Root.rep1.R2.fq.gz
      rep2:
        file_index: Mock-WT-Root.rep2
