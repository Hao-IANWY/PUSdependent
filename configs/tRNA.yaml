# BID-seq tissue tRNA Arabidopsis — totalRNA 流程（只分析 R2）
# 假尿苷 tRNA 文库，R2 结构：8bp UMI + TATAGGG + 插入序列 + polyA 尾巴 + 接头。
# 非温度主实验包含 Root/Leaf/Flower；突变体与 WT 均为每组 Mock/Treat × 3 repeats。
# WT 的第四重复（rep4，260902/260907/260914/260917 补做批次）曾于 2026-09-26 弃用
#   （跨批次批次效应过大）；2026-10-12 起比照突变体 Root rep4/rep5 与 polyARNA WT rep4
#   的先例，以 stages: [count] 重新纳入：只进表达量/count 与 PCA，不参与 Fisher 位点
#   鉴定，位点鉴定维持 3 中 3 口径不变。
# 参数沿用 Temperature_tRNA/config.yaml 的 totalRNA 现行默认值。
#
# 2026-10-08：7 个突变体（trua2_1/2_2/3_1/3_2/4_1/4_2/5_2）的 Root 补入 rep4/rep5——
#   均为 2025 老批次回搬（Mock: 250815-T7-125G，Treat: 20250723-T7-354G），
#   即各样本当年被 2026-09 新批次替换掉的 rep1/rep2（见 data_source/source.tsv）。
#   这 28 个文库一律 stages: [count]：只进表达量/count 与 PCA，不参与 Fisher 位点鉴定，
#   因此 COMBINED / adjustGap / filter_T / Fisher 的输入与产物保持不变（位点鉴定仍 3 中 3）。
#   ⚠ 不要在这些 rep4/5 条目上删掉 stages: [count] —— 否则位点鉴定链会全量重跑，
#     且 STAT/adjustGap、STAT/mpileup、STAT/dependent* 下的陈旧产物会造成计数错配。
#   ⚠ Treat 侧 LSRTT9-LSRTT16（trua2_1 rep5、trua2_2 rep4/5、trua3_1 rep4/5、
#     trua3_2 rep4/5、trua4_1 rep4）不是本项目 BID-seq 文库化学（无 UMI/TATAGGG/polyA，
#     实为全长 tRNA 双端文库），其 count 与其它文库不可比，使用前须先确认。

paths:
  script_dir: /home/HL/project/shuangli/PUS/PUSdependent/BID-transcript.script/bin
  pseudo_callsites_r: /home/HL/project/shuangli/PUS/PUSdependent/BID-transcript.script/bin/Pseudo_callsites.R
  index_bowtie2: /home/HL/reference/Ath/TAIR/tRNA-unique_sn_snoRNA.fa
  index_star: /home/HL/reference/Ath/TAIR/cDNA_STAR_index

env:
  python: /home/HL/miniforge3/envs/analysis/bin/python
  r: /home/HL/miniforge3/envs/analysis/bin/R

pipeline:
  ref:
    ncRNA: /home/HL/reference/Ath/TAIR/tRNA-unique_sn_snoRNA.fa
    # mRNA 暂时停用（2026-09-22）：只跑 ncRNA。恢复时取消此处与 count_mode 的注释。
    # mRNA: /home/HL/reference/Ath/TAIR/Araport11_cdna_20220914_representative_gene_model
  t_site_windows: 2

  # Optional raw expression matrices. Keys must match pipeline.ref.
  # Emits both a Mock-group matrix and an all_samples matrix per ref type.
  expression:
    enabled: true
    count_mode:
      ncRNA: all_alignments
      # mRNA: primary

  # 沿用当前 totalRNA 流程默认阈值。call sites 要求至少 3 个生物学重复通过，
  # 全部样本（含 WT）位点鉴定均为 3 中 3；stages: [count] 的重复不进该口径。
  filter:
    min_depth: 10
    min_avg_depth: 10
    max_padj: 0.01
    min_gap: 5
    min_treat_ratio: 0.05
    ratio_fold: 2
    min_pass_reps: 3

  # totalRNA 只分析 R2：trim 单端模式处理 R2（--adapter AAAAAAAAAAA），
  # 去重用 seqkit rmdup -s。read1 仅作配对信息保留，不进入分析。
  read_layout: paired
  rmdup: true
  trim_galore_length: 35

  # totalRNA 历史默认值：R2 结构为 8bp UMI + TATAGGG + 2bp = 前 17bp。
  # R1 从片段另一端测序，该固定结构位于 R1 的 3' 端，故为 trim_tail: 17。
  # 注意：本流程仅分析 R2（trim/rmdup/umi_extract/比对均只读 R2），
  # R1 参数仅作文档性记录，不影响任何流程产物。
  umi_extract:
    R1:
      trim_front: 0
      trim_tail: 17
    R2:
      trim_front: 17
      trim_tail: 0

