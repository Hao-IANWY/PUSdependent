# BID-seq Temperature Arabidopsis — paired-end, dedup, historical UMI clipping
# Mapping route: Bowtie2/rRNA filtering, then STAR/Araport11 cDNA alignment.
# Temperature series: 6 groups ({WT, trua1b_1, trua1b_2} × {21, 27}) ×
# Mock/Treat × 3 biological replicates = 36 libraries (72 FASTQ files).
# Replicates rep1/rep2 and rep3 originate from different sequencing batches
# (a mixed-batch design); interpret replicate-level variance accordingly.
# Thresholds mirror polyARNA/config.yaml; min_pass_reps = 3 requires all
# three replicates to pass.

paths:
  script_dir: /home/HL/project/shuangli/PUS/PUSdependent/BID-transcript.script/bin
  pseudo_callsites_r: /home/HL/project/shuangli/PUS/PUSdependent/BID-transcript.script/bin/Pseudo_callsites.R
  index_bowtie2: /home/HL/reference/Ath/TAIR/ath_rRNA.fa
  index_star: /home/HL/reference/Ath/TAIR/cDNA_STAR_index

env:
  python: /home/HL/miniforge3/envs/analysis/bin/python
  r: /home/HL/miniforge3/envs/analysis/bin/R

pipeline:
  ref:
    rRNA: /home/HL/reference/Ath/TAIR/ath_rRNA.fa
    mRNA: /home/HL/reference/Ath/TAIR/Araport11_cdna_20220914_representative_gene_model
  t_site_windows: 2

  # Optional raw expression matrices. Keys must match pipeline.ref.
  # Emits both a Mock-group matrix and an all_samples matrix per ref type.
  # all_alignments is alignment-level counting; primary is read-level counting.
  expression:
    enabled: true
    count_mode:
      rRNA: all_alignments
      mRNA: primary

  # Parallel adjustGap chunks. Boundaries always fall between reference
  # sequences/transcripts; small transcripts are batched to avoid excessive jobs.
  adjust_gap:
    chunk_bp: 250000
    max_sequences: 1000

  # Site-filtering thresholds. Values match polyARNA/config.yaml.
  # All three replicates (mixed-batch design) must pass: min_pass_reps = 3.
  filter:
    min_depth: 10           # filter_t_sites: per-replicate depth >= this
    min_avg_depth: 10       # group-level Mock/Treat avg depth >= this
    max_padj: 0.01          # BH-adjusted p-value < this
    min_gap: 5              # Treat gap >= this per passing replicate
    min_treat_ratio: 0.05   # Treat ratio >= this per passing replicate
    ratio_fold: 2           # Treat ratio >= ratio_fold * Mock ratio
    min_pass_reps: 3        # all three replicates must pass (3 of 3)

  # Input layout is global for one workflow run. Accepted values: paired/PE or single/SE.
  # Paired mode requires read1 and read2 for every replicate.
  read_layout: paired

  # true: run the workflow-specific fastp deduplication step; false: pass trimmed
  # reads directly to umi_extract without creating *.dup.fq.gz files.
  rmdup: true

  # Minimum read length passed to trim_galore --length. Matches polyARNA.
  # Both datasets are 150 bp paired-end.
  trim_galore_length: 47

  # fastp UMI-region clipping. These values match the historical polyA workflow.
  umi_extract:
    R1:
      trim_front: 6
      trim_tail: 21
    R2:
      trim_front: 21
      trim_tail: 6

samples:
  WT_21:
    sample_id: "WT_21"
    mock:
      rep1:
        file_index: Mock-21-WT.rep1
        read1: raw_data/Mock-21-WT.rep1.R1.fq.gz
        read2: raw_data/Mock-21-WT.rep1.R2.fq.gz
      rep2:
        file_index: Mock-21-WT.rep2
        read1: raw_data/Mock-21-WT.rep2.R1.fq.gz
        read2: raw_data/Mock-21-WT.rep2.R2.fq.gz
